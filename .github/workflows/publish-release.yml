name: Build and publish VLOTRIT release

on:
  push:
    branches: [main]
    paths:
      - 'app/build.gradle.kts'
      - 'app/src/**'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

concurrency:
  group: vlotrit-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Read app version and skip an existing release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="$(sed -nE 's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release $TAG already exists; skipping. Bump versionName for a new release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check signing key is configured
        if: steps.version.outputs.exists != 'true'
        env:
          VLOTRIT_KEYSTORE_BASE64: ${{ secrets.VLOTRIT_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          if [ -z "$VLOTRIT_KEYSTORE_BASE64" ]; then
            echo "::error::Add the existing update keystore as the repository Actions secret VLOTRIT_KEYSTORE_BASE64, then rerun this workflow."
            exit 1
          fi
          echo "$VLOTRIT_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vlotrit-updates.keystore"
          echo "VLOTRIT_KEYSTORE_PATH=$RUNNER_TEMP/vlotrit-updates.keystore" >> "$GITHUB_ENV"

      - name: Set up Java 17
        if: steps.version.outputs.exists != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        if: steps.version.outputs.exists != 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build signed APK
        if: steps.version.outputs.exists != 'true'
        run: |
          gradle --no-daemon :app:assembleGithubRelease -x lintVitalGithubRelease
          cp app/build/outputs/apk/github/release/app-github-release.apk Vlotrit.apk

      - name: Publish GitHub release
        if: steps.version.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: VLOTRIT ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: Vlotrit.apk
